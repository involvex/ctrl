name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: canary

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Validate (check + lint + fmt)
        run: bun run validate

  build-packages:
    name: build-packages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run build:cli

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:contracts

  mobile-check:
    name: mobile-check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Mobile typecheck
        run: bun run --filter @involvex/ctrl-mobile check
      - name: Mobile unit tests
        run: bun test apps/mobile/src/device

  desktop-package-win:
    name: desktop-package-win
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Install Node after Bun so PATH prefers real node.exe over Bun's node shim
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @involvex/ctrl-desktop build
      - run: bun run --filter @involvex/ctrl-desktop build:gateway
      # electron-builder must run under real Node (Bun's node shim breaks bluebird/source-map)
      - name: electron-builder (Node)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          Write-Host "Using node: $node"
          & node --version
          if ($node -match 'bun') { throw "PATH still resolves node to Bun shim: $node" }
          & node ./node_modules/electron-builder/cli.js --config electron-builder.yml --win dir --x64
      - name: Upload win-unpacked
        uses: actions/upload-artifact@v7
        with:
          name: ctrl-win-unpacked
          path: apps/desktop/release/win-unpacked
          if-no-files-found: error

  # Single required check for branch protection
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - build-packages
      - contract-tests
      - mobile-check
      - desktop-package-win
    steps:
      - name: Check job results
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "build-packages=${{ needs.build-packages.result }}"
          echo "contract-tests=${{ needs.contract-tests.result }}"
          echo "mobile-check=${{ needs.mobile-check.result }}"
          echo "desktop-package-win=${{ needs.desktop-package-win.result }}"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.build-packages.result }}" = "success"
          test "${{ needs.contract-tests.result }}" = "success"
          test "${{ needs.mobile-check.result }}" = "success"
          test "${{ needs.desktop-package-win.result }}" = "success"
