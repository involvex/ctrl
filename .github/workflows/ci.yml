name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.4'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Validate (check + lint + fmt)
        run: bun run validate

  build-packages:
    name: build-packages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun run build:cli

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:contracts

  desktop-package-win:
    name: desktop-package-win
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:desktop:dir
      - name: Upload win-unpacked
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-win-unpacked
          path: apps/desktop/release/win-unpacked
          if-no-files-found: error

  # Single required check for branch protection
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - build-packages
      - contract-tests
      - desktop-package-win
    steps:
      - name: Check job results
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "build-packages=${{ needs.build-packages.result }}"
          echo "contract-tests=${{ needs.contract-tests.result }}"
          echo "desktop-package-win=${{ needs.desktop-package-win.result }}"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.build-packages.result }}" = "success"
          test "${{ needs.contract-tests.result }}" = "success"
          test "${{ needs.desktop-package-win.result }}" = "success"
