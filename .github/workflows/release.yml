name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.3'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run test:contracts

  build-win:
    name: build-win-x64
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Sync package versions from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const files = [
              "package.json",
              "apps/desktop/package.json",
              "apps/cli/package.json",
              "packages/ctrl-a/package.json",
            ];
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }
            console.log("synced version", version);
          ' "$VERSION"

      - run: bun install --frozen-lockfile
      - name: Package desktop (dir + portable + NSIS)
        run: bun run build:desktop
      - name: Zip win-unpacked
        shell: bash
        run: |
          cd apps/desktop/release
          7z a -tzip "ctrl-${VERSION}-win-x64-unpacked.zip" win-unpacked
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-win-x64-${{ env.VERSION }}
          path: |
            apps/desktop/release/ctrl-*-win-x64-portable.exe
            apps/desktop/release/ctrl-*-win-x64-setup.exe
            apps/desktop/release/ctrl-*-win-x64-unpacked.zip
          if-no-files-found: error

  github-release:
    name: github-release
    runs-on: ubuntu-latest
    needs: build-win
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ctrl-win-x64-${{ env.VERSION }}
          path: dist-release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ctrl ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Artifacts (Windows x64)

            | File | Description |
            | --- | --- |
            | `ctrl-${{ env.VERSION }}-win-x64-portable.exe` | Portable single-file build |
            | `ctrl-${{ env.VERSION }}-win-x64-setup.exe` | NSIS installer |
            | `ctrl-${{ env.VERSION }}-win-x64-unpacked.zip` | Unpacked directory (recommended for daily use) |

            See [SECURITY.md](./SECURITY.md) for vulnerability reporting.
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
